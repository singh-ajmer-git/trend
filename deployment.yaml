apiVersion: apps/v1
kind: Deployment
metadata:
  name: trend-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: trend-app
  template:
    metadata:
      labels:
        app: trend-app
    spec:
      containers:
        - name: trend-container
          image: 524781515606.dkr.ecr.us-west-2.amazonaws.com/trend-repo:v3
          ports:
            - containerPort: 80
